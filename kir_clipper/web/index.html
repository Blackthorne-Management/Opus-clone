<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIR Clipper</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1b1b1b; --muted:#6b6b6b; --line:#e2e2de; --accent:#e63946; --ok:#2a9d5c; --warn:#d98e04; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --card:#1d1d1d; --ink:#eee; --muted:#9a9a9a; --line:#333; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:16px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:2; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  .pill { padding:3px 10px; border-radius:99px; font-size:12px; font-weight:600; }
  .dry { background:var(--warn); color:#000; } .live { background:var(--ok); color:#fff; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav button { border:1px solid var(--line); background:transparent; color:var(--ink); padding:6px 12px; border-radius:6px; cursor:pointer; }
  nav button.on { background:var(--ink); color:var(--bg); }
  main { padding:20px; max-width:1300px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(560px, 1fr)); gap:16px; }
  @media (max-width:640px) { .grid { grid-template-columns:1fr; } main { padding:16px; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; gap:14px; }
  @media (max-width:640px) { .card { flex-direction:column; } }
  video { width:200px; aspect-ratio:9/16; background:#000; border-radius:6px; flex-shrink:0; }
  .body { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
  .score { font-size:22px; font-weight:800; }
  .s-hi { color:var(--ok); } .s-mid { color:var(--warn); } .s-lo { color:var(--accent); }
  .muted { color:var(--muted); font-size:12px; }
  label { font-size:12px; color:var(--muted); display:block; }
  input, textarea, select { width:100%; font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  textarea { min-height:56px; resize:vertical; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:90px; }
  .btn { border:0; padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:600; }
  .approve { background:var(--ok); color:#fff; } .reject { background:var(--accent); color:#fff; } .plain { background:var(--line); color:var(--ink); }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; background:var(--card); }
  td, th { padding:7px 10px; border-bottom:1px solid var(--line); text-align:left; font-size:13px; vertical-align:top; }
  pre { background:var(--card); border:1px solid var(--line); padding:12px; border-radius:8px; white-space:pre-wrap; }
  .hist { display:flex; align-items:flex-end; gap:6px; height:120px; margin:10px 0 4px; }
  .hist div { flex:1; background:var(--muted); border-radius:3px 3px 0 0; min-height:2px; position:relative; }
  .hist span { position:absolute; top:-18px; width:100%; text-align:center; font-size:11px; }
  .empty { color:var(--muted); padding:40px; text-align:center; }
  .status { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); padding:6px 20px; border-bottom:1px solid var(--line); background:var(--card); }
  .status b { color:var(--ink); font-weight:600; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; background:var(--muted); }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--accent); } .dot.warn { background:var(--warn); }
  #toasts { position:fixed; bottom:16px; right:16px; display:flex; flex-direction:column; gap:8px; z-index:20; max-width:min(420px, calc(100vw - 32px)); }
  .toast { background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.25); }
  .toast.err { background:var(--accent); color:#fff; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:grid; place-items:center; z-index:30; padding:16px; }
  .modal { background:var(--card); color:var(--ink); border-radius:12px; padding:22px; max-width:600px; width:100%; max-height:90vh; overflow:auto; font-size:14px; }
  .modal h3 { margin-top:0; } .modal ol, .modal ul { padding-left:20px; } .modal li { margin:6px 0; }
  .modal .row { margin-top:14px; }
  .settings section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .settings h3 { margin:0 0 8px; font-size:15px; }
  .setting { display:grid; grid-template-columns:1fr 220px; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); }
  .setting:last-child { border-bottom:0; } .setting span { font-size:13px; color:var(--ink); }
  @media (max-width:640px) { nav { flex-wrap:nowrap; overflow-x:auto; width:100%; padding-bottom:4px; } nav button { white-space:nowrap; }
    .setting { grid-template-columns:1fr; } video { width:100%; max-width:320px; }
    table.posts tr:first-child { display:none; }
    table.posts tr { display:block; padding:10px 4px; border-bottom:1px solid var(--line); }
    table.posts td { display:inline-block; border:0; padding:2px 8px 2px 0; }
    table.posts td:last-child { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
    table.posts td:last-child .btn { flex:1; text-align:center; padding:12px; } }
</style>
</head>
<body>
<header>
  <h1>KIR Clipper</h1>
  <span id="mode" class="pill"></span>
  <nav id="tabs"></nav>
</header>
<div id="status" class="status"></div>
<main id="view"></main>
<div id="toasts"></div>
<script>
const TABS = [
  ["review", "Needs review"], ["dry_run", "Would auto-post"], ["approved,scheduled", "Scheduled"],
  ["posted", "Posted"], ["dropped,rejected,failed", "Dropped / rejected"], ["longform", "Long-form"], ["import", "Import posted reel"], ["posts", "Post calendar"],
  ["stats", "Stats"], ["events", "Activity log"], ["settings", "Settings"],
];
function toast(msg, err = false) {
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), err ? 9000 : 4000);
}
// A pop-up with buttons; resolves with the clicked button's value (or null if closed).
function modal(html, buttons) {
  return new Promise(resolve => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}<div class="row">${buttons.map((b, i) =>
      `<button class="btn ${b.kind || "plain"}" data-i="${i}">${esc(b.label)}</button>`).join("")}</div></div>`;
    const done = v => {
      modal.fields = Object.fromEntries([...bg.querySelectorAll("input,select,textarea")].map(el => [el.id || el.name, el.value]));
      bg.remove(); resolve(v);
    };
    bg.querySelectorAll("button[data-i]").forEach(el => el.onclick = () => done(buttons[el.dataset.i].value));
    bg.onclick = e => { if (e.target === bg) done(null); };
    document.body.appendChild(bg); bg.querySelector("button").focus();
  });
}
let current = location.hash.slice(1) || "review";
let summary = {};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when = iso => iso ? new Date(iso).toLocaleString([], {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit", timeZone: summary.timezone || undefined}) : "";
const countdown = iso => {
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return "due now";
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  return "in " + (d ? `${d}d ${h}h` : h ? `${h}h ${mm}m` : `${mm}m`);
};
setInterval(() => document.querySelectorAll("[data-countdown]").forEach(el => el.textContent = countdown(el.dataset.countdown)), 30000);
const STEP_STATUS = {posted: "✓ posted", scheduled: "scheduled", post_by_hand: "post by hand now", failed: "failed", projected: "planned"};
function planList(tl) {
  if (!tl || !tl.length) return "";
  return `<div><b style="font-size:13px">Posting plan</b><table style="margin-top:4px">${tl.map(s => `<tr>
    <td>${s.number}. ${esc(s.label)}</td><td class="muted">${(s.platforms||[]).join(", ")}</td>
    <td>${STEP_STATUS[s.status]||s.status}</td>
    <td>${s.status === "posted" ? when(s.at) : s.status === "post_by_hand" ? `${when(s.at)} · <b>due now</b>`
      : `${when(s.at)} · <b data-countdown="${s.at}">${countdown(s.at)}</b>`}</td></tr>`).join("")}</table></div>`;
}
async function renderHookTests() {
  const el = $("#hooktests"); if (!el) return;
  const d = await api("/api/hooktests");
  el.classList.remove("muted");
  if (!d.decided && !d.running) { el.innerHTML = `<p class="muted">Each new clip's Trial Reel uses hook A and its Mirrored Trial Reel hook B. Results appear here 3 days after both post.</p>`; return; }
  const label = w => ({a: "A won", b: "B won", tie: "tie", void: "cancelled"}[w] || "running");
  el.innerHTML = `<p>${d.decided} decided (A won ${d.a_wins}, B won ${d.b_wins}, ties ${d.ties}) · ${d.running} running.
    Winning hooks steer the +90/+180 reposts and new hooks.</p>
    <table><tr><th>clip</th><th>hook A (trial)</th><th>hook B (mirrored)</th><th>result</th></tr>${d.recent.map(t => `<tr>
      <td>${t.clip_id}</td><td${t.winner==="a"?' style="font-weight:700"':""}>${esc(t.hook_a)}${t.views_a!=null?`<br><span class="muted">${t.views_a.toLocaleString()} views</span>`:""}</td>
      <td${t.winner==="b"?' style="font-weight:700"':""}>${esc(t.hook_b)}${t.views_b!=null?`<br><span class="muted">${t.views_b.toLocaleString()} views</span>`:""}</td>
      <td>${label(t.winner)}</td></tr>`).join("")}</table>`;
}
async function renderBestTimes() {
  const el = $("#besttimes"); if (!el) return;
  const data = await api("/api/optimize");
  el.classList.remove("muted");
  el.innerHTML = data.map(p => {
    if (!p.posts_with_data) return `<p><b>${p.platform}</b>: <span class="muted">no results yet. Times are suggested once posts have 3-day numbers.</span></p>`;
    const rows = p.hours.map(h => `<tr><td>${String(h.hour).padStart(2,"0")}:00</td><td>${h.posts}</td><td>${h.median_views.toLocaleString()}</td>
      <td style="color:${h.lift>=1?"var(--ok)":"var(--accent)"}">${h.lift >= 1 ? "+" : ""}${Math.round((h.lift-1)*100)}%</td></tr>`).join("");
    const changed = p.enough && p.suggested.join() !== p.current.join();
    return `<div class="card" style="display:block;margin-bottom:10px"><b>${p.platform}</b>
      <span class="muted">${p.posts_with_data} posts with results · now posting at ${p.current.join(", ")}</span>
      <details><summary>By hour</summary><table><tr><th>hour</th><th>posts</th><th>typical views</th><th>vs your average</th></tr>${rows}</table></details>
      ${!p.enough ? `<p class="muted">Needs ${summary.optimize_min||20}+ posts with results before suggesting changes.</p>`
        : changed ? `<p>Suggested: <b>${p.suggested.join(", ")}</b>${p.explore_slot ? ` <span class="muted">(${p.explore_slot} tests a new hour)</span>` : ""}</p>
          <button class="btn approve" onclick="api('/api/optimize/apply',{platform:'${p.platform}'}).then(() => { toast('Posting times updated for ${p.platform}'); load(); })">Use these times</button>`
        : `<p class="muted">Your current times already match your best hours.</p>`}</div>`;
  }).join("");
}
async function addNumbers(postId) {
  const bg = await modal(`<h3>Add this post's numbers</h3><p class="muted">For posts made by hand (Trial Reels).
    Best around 3 days after posting. Find them under the reel's Insights in the Instagram app.</p>
    <div class="row"><label>Views<input id="m_views" inputmode="numeric"></label><label>Likes<input id="m_likes" inputmode="numeric"></label></div>
    <div class="row"><label>Comments<input id="m_comments" inputmode="numeric"></label><label>Shares<input id="m_shares" inputmode="numeric"></label>
    <label>Saves<input id="m_saves" inputmode="numeric"></label></div>`,
    [{label: "Save", value: "save", kind: "approve"}, {label: "Cancel", value: null}]);
  if (bg !== "save") return;
  const f = modal.fields;
  await api(`/api/posts/${postId}/metrics`, {views: f.m_views, likes: f.m_likes, comments: f.m_comments,
    shares: f.m_shares, saves: f.m_saves});
  toast("Numbers saved"); load();
}
function renderStatus() {
  const sv = summary.service || {}, w = sv.watcher || {}, pub = sv.publisher || {}, lf = sv.longform || {};
  const disk = summary.free_gb, low = disk < summary.min_free_gb;
  const parts = [];
  if (!w.at) parts.push(`<span><span class="dot bad"></span><b>Background service not running.</b> Start it with scripts\\install-service.ps1 or "kir run".</span>`);
  else if (!w.ok) parts.push(`<span><span class="dot bad"></span><b>Background service stopped</b> (last seen ${when(w.at)})</span>`);
  else parts.push(`<span><span class="dot ok"></span>Watching for recordings</span>`);
  if (w.processing || (summary.processing||[]).length) parts.push(`<span><span class="dot warn"></span>Processing <b>${esc(w.processing || (summary.processing[0].original_path||"").split(/[\\/]/).pop())}</b></span>`);
  if (lf.queued) parts.push(`<span><span class="dot warn"></span>${lf.queued} long-form edit${lf.queued>1?"s":""} in progress</span>`);
  if (pub.mode === "blocked") parts.push(`<span><span class="dot bad"></span><b>Posting blocked:</b> ${esc(pub.error)}</span>`);
  if (disk !== undefined) parts.push(`<span><span class="dot ${low ? "bad" : "ok"}"></span>${low ? "<b>Low disk space:</b> " : ""}${disk} GB free</span>`);
  $("#status").innerHTML = parts.join("");
}
const scoreClass = s => s >= (summary.auto_post_threshold||90) ? "s-hi" : s >= (summary.auto_reject_floor||60) ? "s-mid" : "s-lo";
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if (r.status === 401) { location.href = "/login"; throw new Error("sign in"); }
  if (!r.ok) { const d = (await r.json().catch(()=>({detail:r.statusText}))).detail; toast(typeof d === "string" ? d : "Something went wrong", true); throw new Error(r.status); }
  return r.json();
}
function renderTabs() {
  $("#tabs").innerHTML = TABS.map(([k, l]) => {
    const n = k.includes("posts")||k==="stats"||k==="events"||k==="longform"||k==="import"||k==="settings" ? "" : k.split(",").reduce((a, s) => a + ((summary.clips||{})[s]||0), 0);
    return `<button class="${k===current?"on":""}" data-k="${k}">${l}${n!==""?` (${n})`:""}</button>`;
  }).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { current = b.dataset.k; location.hash = current; load(); });
  renderStatus();
  const m = $("#mode"); m.className = "pill " + (summary.dry_run ? "dry" : "live");
  m.textContent = summary.dry_run ? "DRY RUN: nothing posts" : "LIVE: auto-posting " + summary.auto_post_threshold + "+";
}
function clipCard(c) {
  const styles = ["bold_pop","karaoke","boxed","minimal"], crops = ["face","center","blur_pad"], zooms = ["none","punch","slow_push"];
  const r = c.recipe || {};
  const sel = (name, opts, v) => `<select data-r="${name}">${opts.map(o => `<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`;
  const posts = c.posts.map(p => `${p.platform}: ${p.status} ${when(p.publish_at)}${p.last_error?` (${esc(p.last_error)})`:""}`).join("<br>");
  const canAct = ["review","dry_run","dropped"].includes(c.status);
  return `<div class="card" data-id="${c.id}">
    ${c.file_path ? `<video src="/media/clip/${c.id}" controls preload="metadata"></video>` : `<div class="muted" style="width:200px">not rendered</div>`}
    <div class="body">
      <div class="row" style="align-items:baseline">${r.imported ? `<span class="pill" style="background:var(--line);color:var(--ink)">Imported reel</span>`
        : `<span class="score ${scoreClass(c.score)}">${c.score}</span>`}
        <span class="muted">clip ${c.id}${c.version>1?` · re-edit v${c.version} of ${c.parent_clip_id}`:""} · ${c.duration}s · ${c.status}${c.note?` · ${esc(c.note)}`:""}</span></div>
      <div><b>Hook:</b> ${esc(c.hook)}</div>
      <div class="muted">${esc(c.reason)}</div>
      ${c.suggested_time ? `<div class="muted">Next free slot: ${when(c.suggested_time)}</div>` : ""}
      ${c.timeline && c.timeline.length ? planList(c.timeline) : posts ? `<div class="muted">${posts}</div>` : ""}
      <label>Title<input data-f="title" value="${esc(c.title)}"></label>
      <label>Caption<textarea data-f="caption">${esc(c.caption)}</textarea></label>
      <label>Hashtags<input data-f="hashtags" value="${esc((c.hashtags||[]).join(" "))}"></label>
      <details><summary>Per-platform copy</summary>${Object.entries(c.copy).map(([p, v]) =>
        `<label>${p} title<input data-p="${p}" data-k="title" value="${esc(v.title)}"></label>
         <label>${p} caption<textarea data-p="${p}" data-k="caption">${esc(v.caption)}</textarea></label>`).join("")}</details>
      ${r.imported ? "" : `<details><summary>Re-render (style, crop, zoom, timing)</summary>
        <div class="row">${sel("caption_style", styles, r.caption_style)}${sel("crop_mode", crops, r.crop_mode)}${sel("zoom", zooms, r.zoom)}</div>
        <div class="row"><label>Start (s)<input data-b="start" value="${c.start}"></label><label>End (s)<input data-b="end" value="${c.end}"></label>
          <label>Hook overlay<input data-r="hook_text" value="${esc(r.hook_text)}"></label></div>
        <button class="btn plain" data-a="render">Re-render</button>
      </details>`}
      <div class="row">
        ${canAct ? `<button class="btn approve" data-a="approve">Approve &amp; schedule</button>` : ""}
        <button class="btn plain" data-a="save">Save copy</button>
        ${c.status !== "rejected" && !["posted","scheduled"].includes(c.status) ? `<button class="btn reject" data-a="reject">Reject</button>` : ""}
        ${c.status === "posted" ? `<select data-a="flag"><option value="">Repost: automatic</option><option value="no_repost" ${c.note==="no_repost"?"selected":""}>Never repost</option><option value="force_repost" ${c.note==="force_repost"?"selected":""}>Always repost</option></select>` : ""}
      </div>
    </div></div>`;
}
function collect(card) {
  const pc = {};
  card.querySelectorAll("[data-p]").forEach(el => { (pc[el.dataset.p] ||= {})[el.dataset.k] = el.value; });
  return { title: $("[data-f=title]", card).value, caption: $("[data-f=caption]", card).value,
    hashtags: $("[data-f=hashtags]", card).value.split(/\s+/).filter(Boolean), platform_captions: pc };
}
function wire() {
  document.querySelectorAll(".card").forEach(card => {
    const id = card.dataset.id;
    card.querySelectorAll("button[data-a]").forEach(b => b.onclick = async () => {
      const a = b.dataset.a, label = b.textContent;
      if (a === "reject" && !(await modal("<h3>Reject this clip?</h3><p>It won't be posted. You can still find it under Dropped / rejected.</p>",
          [{label: "Reject", value: true, kind: "reject"}, {label: "Cancel", value: false}]))) return;
      b.disabled = true;
      b.textContent = {approve: "Scheduling...", render: "Rendering...", save: "Saving...", reject: "Rejecting..."}[a] || "Working...";
      try {
        if (a === "approve") { await api(`/api/clips/${id}/edit`, collect(card)); await api(`/api/clips/${id}/approve`, {}); toast("Approved and scheduled. See its posting plan under Scheduled."); }
        if (a === "reject") { await api(`/api/clips/${id}/reject`, {}); toast("Clip rejected"); }
        if (a === "save") { await api(`/api/clips/${id}/edit`, collect(card)); toast("Saved"); }
        if (a === "render") {
          const recipe = {}; card.querySelectorAll("[data-r]").forEach(el => recipe[el.dataset.r] = el.value);
          const body = {...collect(card), recipe}; card.querySelectorAll("[data-b]").forEach(el => body[el.dataset.b] = el.value);
          b.textContent = "Rendering..."; await api(`/api/clips/${id}/edit`, body);
        }
        load();
      } finally { b.disabled = false; b.textContent = label; }
    });
    const f = $("select[data-a=flag]", card);
    if (f) f.onchange = () => api(`/api/clips/${id}/flag`, {note: f.value || null});
  });
}
async function load() {
  summary = await api("/api/summary"); renderTabs();
  const root = $("#view");
  const banner = summary.manual_due ? `<div class="card" style="display:block;border-color:var(--warn);margin-bottom:16px">
    <b>${summary.manual_due} Trial Reel${summary.manual_due>1?"s are":" is"} ready to post by hand.</b>
    Open <a href="#posts">Post calendar</a>, tap <b>Download</b>, post it in the Instagram app as a Trial Reel
    (toggle "Trial" on the share screen), then tap <b>Mark posted</b>.
    <span class="muted">iPhone: after Download, tap the share icon and choose Save Video so Instagram can see it.
    Android: it goes to your Downloads folder.</span></div>` : "";
  root.innerHTML = banner;
  const v = document.createElement("div"); root.appendChild(v);
  if (current === "longform") { await renderLongform(v); return; }
  if (current === "import") { renderImport(v); return; }
  if (current === "settings") { await renderSettings(v); return; }
  if (current === "stats") {
    const h = summary.histogram, max = Math.max(1, ...h);
    v.innerHTML = `<h3>Score distribution (original clips)</h3>
      <div class="hist">${h.map(n => `<div style="height:${n/max*100}%"><span>${n||""}</span></div>`).join("")}</div>
      <div class="row muted">${h.map((_, i) => `<span style="text-align:center">${i*10}</span>`).join("")}</div>
      <p class="muted">Auto-post at ${summary.auto_post_threshold}+, drop below ${summary.auto_reject_floor}. Tune in config.yaml.</p>

// ---------------------------------------------------------------- long-form
const hms = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; };
const secs = t => t.trim().split(":").reduce((a, x) => a * 60 + Number(x), 0);
const WORKING = ["queued", "planning", "rendering"];
let lfTimer = null;
function segEditor(g) {
  const rows = g.segments.map(s => ({title: s.title, start: s.start, end: s.end}));
  return `<div class="card" style="display:block" data-stream="${g.stream.id}" data-dur="${g.stream.duration}">
    <b>Split this stream into videos</b>
    <p class="muted">Each row becomes its own YouTube video. Times are h:mm:ss from the start of the recording
      (${hms(g.stream.duration)} long). Suggested splits come from long silences.</p>
    <div class="segrows">${rows.map(segRow).join("")}</div>
    <div class="row" style="margin-top:8px">
      <button class="btn plain" data-a="addseg">+ Split last segment in two</button>
      <button class="btn approve" data-a="saveseg">Build long-form video(s)</button>
    </div></div>`;
}
const segRow = r => `<div class="row segrow"><label>Title<input data-k="title" value="${esc(r.title)}"></label>
  <label>Start<input data-k="start" value="${hms(r.start)}"></label><label>End<input data-k="end" value="${hms(r.end)}"></label>
  <button class="btn plain" data-a="rmseg" style="flex:0 0 auto;align-self:end">Remove</button></div>`;
function lfCard(s) {
  const clip = s.clip, r = s.render, m = s.meta || {};
  const head = `<div class="row" style="align-items:baseline"><b>Part ${s.idx}: ${esc(s.title||"")}</b>
    <span class="muted">${hms(s.start)}-${hms(s.end)} · ${clip ? clip.status : s.status}</span></div>`;
  if (WORKING.includes(s.status))
    return `<div class="card" style="display:block">${head}<p>${s.status === "queued" ? "Waiting to start..." : s.status === "planning" ? "Claude is reading the stream and planning the edit..." : "Rendering (long streams take a while)..."}</p></div>`;
  if (s.status === "failed")
    return `<div class="card" style="display:block" data-lf="${s.id}">${head}<p class="s-lo">${esc(s.error)}</p>
      <button class="btn plain" data-a="lfreplan">Try again</button></div>`;
  if (!clip) return "";
  const locked = ["approved","scheduled","posted"].includes(clip.status);
  const cuts = s.cuts.map((c, i) => `<label style="display:flex;gap:8px;align-items:flex-start;color:var(--ink)">
      <input type="checkbox" data-cut="${i}" ${c.enabled?"checked":""} ${locked?"disabled":""} style="width:auto">
      <span><b>${hms(c.start)}</b> (${Math.round(c.end-c.start)}s) ${c.category.replace("_"," ")} · ${c.confidence}%<br><span class="muted">${esc(c.reason)}</span></span></label>`).join("");
  const pops = s.popups.map((p, i) => `<label style="display:flex;gap:8px;color:var(--ink)"><input type="checkbox" data-pop="${i}" ${p.enabled!==false?"checked":""} ${locked?"disabled":""} style="width:auto"> ${hms(p.t)} "${esc(p.text)}"</label>`).join("");
  return `<div class="card" data-lf="${s.id}" data-clip="${clip.id}" style="display:block">${head}
    <video src="/media/clip/${clip.id}?v=${encodeURIComponent(clip.updated_at)}" controls preload="metadata" style="width:100%;max-width:720px;aspect-ratio:16/9;height:auto"></video>
    ${r ? `<p class="muted">${hms(r.duration)} long · ${(r.removed_seconds/60).toFixed(1)} min removed from ${hms(r.source_seconds)} of stream · ${r.chapters.length} chapters</p>` : ""}
    <label>YouTube title<input data-f="title" value="${esc(m.title)}" ${locked?"disabled":""}></label>
    <label>Description (chapters are added automatically)<textarea data-f="description" style="min-height:110px" ${locked?"disabled":""}>${esc(m.description)}</textarea></label>
    <label>Tags<input data-f="tags" value="${esc((m.tags||[]).join(", "))}" ${locked?"disabled":""}></label>
    ${r ? `<details><summary>Chapters</summary><pre>${esc(r.chapters.map(c => hms(c.t)+" "+c.title).join("\n"))}</pre></details>` : ""}
    ${s.thumbnails && s.thumbnails.length ? `<div><b style="font-size:13px">Thumbnail</b> <span class="muted">(pick one; set it in YouTube Studio after it posts)</span>
      <div class="row" style="margin-top:6px">${s.thumbnails.map((t, i) => `<label style="flex:1;min-width:200px;color:var(--ink);cursor:pointer">
        <img src="/media/thumb/${s.id}/${i}?v=${encodeURIComponent(t.text)}" alt="${esc(t.text)}" style="width:100%;border-radius:6px;outline:${i===s.thumbnail_choice?"4px solid var(--ok)":"1px solid var(--line)"}">
        <span style="display:flex;gap:6px;align-items:center;margin-top:4px"><input type="radio" name="thumb${s.id}" data-thumb="${i}" ${i===s.thumbnail_choice?"checked":""} style="width:auto">
        <span class="muted">${t.source && t.source.startsWith("gemini") ? '<b style="color:var(--ok)">AI</b> · ' : ""}${esc(t.why)}${t.ai_error ? ` <span class="s-lo">(AI unavailable: ${esc(t.ai_error)})</span>` : ""}</span></span></label>`).join("")}</div>
      <div class="row" style="margin-top:6px"><a class="btn plain" href="/media/thumb/${s.id}/${s.thumbnail_choice}?download=1" download style="text-align:center">Download chosen thumbnail</a>
        <button class="btn plain" data-a="lfthumbs">Make 3 new options</button></div></div>` : ""}
    <details ${s.cuts.length?"open":""}><summary>Cuts (${s.cuts.filter(c=>c.enabled).length} of ${s.cuts.length} applied; untick to keep that part)</summary>${cuts || '<p class="muted">No cuts suggested.</p>'}</details>
    <details><summary>Pop-ups (${s.popups.length})</summary>${pops || '<p class="muted">None.</p>'}</details>
    <div class="row" style="margin-top:8px">
      ${locked ? "" : `<button class="btn approve" data-a="lfapprove">Approve &amp; schedule on YouTube</button>
      <button class="btn plain" data-a="lfsave">Save text</button>
      <button class="btn plain" data-a="lfrender">Re-render with changes</button>
      <button class="btn plain" data-a="lfreplan">Re-plan from scratch</button>
      <button class="btn reject" data-a="lfreject">Reject</button>`}
    </div></div>`;
}
function lfChanges(card) {
  const body = {title: $("[data-f=title]", card).value, description: $("[data-f=description]", card).value,
    tags: $("[data-f=tags]", card).value.split(",").map(t => t.trim()).filter(Boolean), cuts_enabled: {}, popups_enabled: {}};
  card.querySelectorAll("[data-cut]").forEach(el => body.cuts_enabled[el.dataset.cut] = el.checked);
  card.querySelectorAll("[data-pop]").forEach(el => body.popups_enabled[el.dataset.pop] = el.checked);
  return body;
}
async function renderLongform(v) {
  const groups = await api("/api/longform");
  clearTimeout(lfTimer);
  if (!groups.length) { v.innerHTML = `<div class="empty">No streams yet. After a stream is processed it appears here to split and build.</div>`; return; }
  v.innerHTML = groups.map(g => {
    const needs = g.segments.some(s => s.status === "needs_segments");
    const changeable = !g.segments.some(s => s.clip && ["approved","scheduled","posted"].includes(s.clip.status));
    return `<h3>${esc(g.stream.name)} <span class="muted">stream ${g.stream.id} · ${hms(g.stream.duration)}</span></h3>
      ${needs ? segEditor(g) : `<div style="display:flex;flex-direction:column;gap:12px">${g.segments.map(lfCard).join("")}</div>
      ${changeable ? `<details style="margin-top:8px"><summary>Change how this stream is split</summary>${segEditor(g)}</details>` : ""}`}`;
  }).join("");
  // segment editors
  v.querySelectorAll("[data-stream]").forEach(ed => {
    const rows = $(".segrows", ed);
    ed.querySelectorAll("[data-a=rmseg]").forEach(b => b.onclick = () => { if (rows.children.length > 1) b.closest(".segrow").remove(); });
    $("[data-a=addseg]", ed).onclick = () => {
      const last = rows.lastElementChild, st = secs($("[data-k=start]", last).value), en = secs($("[data-k=end]", last).value), mid = (st + en) / 2;
      $("[data-k=end]", last).value = hms(mid);
      rows.insertAdjacentHTML("beforeend", segRow({title: `Part ${rows.children.length + 1}`, start: mid, end: en}));
      const added = rows.lastElementChild; $("[data-a=rmseg]", added).onclick = () => added.remove();
    };
    $("[data-a=saveseg]", ed).onclick = async () => {
      const segments = [...rows.querySelectorAll(".segrow")].map(r => ({title: $("[data-k=title]", r).value,
        start: secs($("[data-k=start]", r).value), end: secs($("[data-k=end]", r).value)}));
      await api(`/api/streams/${ed.dataset.stream}/segments`, {segments}); load();
    };
  });
  // review cards
  v.querySelectorAll("[data-lf]").forEach(card => {
    const id = card.dataset.lf, clip = card.dataset.clip;
    card.querySelectorAll("[data-thumb]").forEach(r => r.onchange = async () => {
      await api(`/api/longform/${id}/thumbnail`, {choice: Number(r.dataset.thumb)}); toast("Thumbnail chosen"); load();
    });
    card.querySelectorAll("button[data-a]").forEach(b => b.onclick = async () => {
      b.disabled = true;
      try {
        const a = b.dataset.a;
        if (a === "lfthumbs") { b.textContent = "Designing..."; await api(`/api/longform/${id}/thumbnail`, {regenerate: true}); toast("New thumbnail options ready"); }
        if (a === "lfsave") await api(`/api/longform/${id}/edit`, lfChanges(card));
        if (a === "lfrender") await api(`/api/longform/${id}/edit`, {...lfChanges(card), rerender: true});
        if (a === "lfreplan") { if (!confirm("Ask Claude to plan this edit again from scratch?")) return; await api(`/api/longform/${id}/edit`, {rerender: true, replan: true}); }
        if (a === "lfapprove") { await api(`/api/longform/${id}/edit`, lfChanges(card)); await api(`/api/clips/${clip}/approve`, {}); }
        if (a === "lfreject") await api(`/api/clips/${clip}/reject`, {note: prompt("Why? (optional)") || null});
        load();
      } finally { b.disabled = false; }
    });
  });
  if (groups.some(g => g.segments.some(s => WORKING.includes(s.status)))) lfTimer = setTimeout(() => current === "longform" && load(), 15000);
}

const TEXT_HELP = `<h3>Does this reel have captions or text on screen?</h3>

    <li><b>No text on screen at all?</b> Choose "My reel has no text" and the app simply flips the video.</li>
  </ol>
  <p class="muted">The clean copy gets new captions in your brand style for the mirrored version and the reposts.</p>`;
const fmtLen = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
function videoLength(file) {
  return new Promise(resolve => {
    const el = document.createElement("video"), url = URL.createObjectURL(file);
    el.preload = "metadata";
    el.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve(el.duration); };
    el.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    el.src = url;
  });
}

  ["Post everything five times", ["cadence.enabled", "cadence.trial_mode", "reedit.style", "reedit.max_reposts"]],

  ["Phone access", ["dashboard.lan_access", "dashboard.pin"]],
];
const CHOICE_LABELS = {manual: "Post by hand (reminder)", api: "Automatic (Upload-Post)", skip: "Don't make trial reels",
  reedit: "New edit each time", same: "Same file",
  background: "AI background + channel template (most consistent)", full: "Full AI design (uses your photos)"};
async function renderSettings(v) {
  const data = await api("/api/settings"), f = data.fields;
  const input = (k) => {
    const x = f[k], val = x.value;
    if (k === "review.dry_run") return `<select data-k="${k}"><option value="true" ${val?"selected":""}>Dry run (nothing posts)</option><option value="false" ${!val?"selected":""}>Live (posting for real)</option></select>`;
    if (x.type === "bool") return `<select data-k="${k}"><option value="true" ${val?"selected":""}>On</option><option value="false" ${!val?"selected":""}>Off</option></select>`;
    if (x.type === "int") return `<input data-k="${k}" type="number" min="${x.range[0]}" max="${x.range[1]}" value="${val ?? ""}">`;
    if (x.choices) return `<select data-k="${k}">${x.choices.map(c => `<option value="${c}" ${c===val?"selected":""}>${esc(CHOICE_LABELS[c]||c)}</option>`).join("")}</select>`;
    if (x.type === "list") return `<input data-k="${k}" value="${esc((val||[]).join(", "))}">`;
    return `<input data-k="${k}" value="${esc(val ?? "")}" ${k.endsWith("pin") ? 'inputmode="numeric" autocomplete="off"' : ""}>`;
  };
  v.innerHTML = `<div class="settings" style="max-width:820px">
    ${SETTING_GROUPS.map(([title, keys]) => `<section><h3>${title}</h3>${keys.map(k => `<div class="setting"><span>${esc(f[k].help)}</span>${input(k)}</div>`).join("")}
      ${title === "Phone access" ? `<p class="muted">${data.phone_url ? `On your phone (same Wi-Fi) open <b>${esc(data.phone_url)}</b> and enter the PIN.`
        : "Turn this on and set a PIN, then restart the app. Windows may ask to allow the connection the first time: choose Private networks."}</p>` : ""}</section>`).join("")}
    <button class="btn approve" id="savesettings">Save changes</button>
    <p class="muted">Saved to config.local.yaml. Everything else (folders, brand, API keys) is in config.yaml and .env.</p></div>`;
  $("#savesettings", v).onclick = async () => {
    const changes = {};
    v.querySelectorAll("[data-k]").forEach(el => {
      const k = el.dataset.k, x = f[k], raw = el.value;
      const val = x.type === "bool" ? raw === "true" : x.type === "int" ? Number(raw) : x.type === "list" ? raw : raw;
      const before = x.type === "list" ? (x.value||[]).join(", ") : x.value;
      if (String(val) !== String(before ?? "")) changes[k] = val;
    });
    if (!Object.keys(changes).length) { toast("Nothing changed"); return; }
    if (changes["review.dry_run"] === false) {
      const ok = await modal(`<h3>Go live?</h3><p>Clips scoring ${f["review.auto_post_threshold"].value}+ will post automatically,
        and everything you approve will go out on schedule through Upload-Post.</p>
        <p>Recommended only after you've checked a stream or two in dry run and liked the picks.</p>`,
        [{label: "Go live", value: true, kind: "approve"}, {label: "Stay in dry run", value: false}]);
      if (!ok) return;
    }
    await api("/api/settings", changes);
    toast("Settings saved" + (Object.keys(changes).some(k => k.startsWith("dashboard.")) ? ". Restart the app for phone access changes." : ""));
    load();
  };
}

      {label: "My reel has no text", value: "notext"},
      {label: "Continue without (skip mirrored step)", value: "continue"}]);
    if (choice === "clean") { form.clean.focus(); form.clean.click(); }
    if (choice === "notext") { form.has_text.checked = false; acknowledged = true; }
    if (choice === "continue") acknowledged = true;
    return choice;
  };
  form.video.onchange = () => { acknowledged = false; if (form.video.files[0] && form.has_text.checked && !form.clean.files[0]) askAboutText(); };
  form.clean.onchange = () => { if (form.clean.files[0]) acknowledged = true; };
  $("#whytext", v).onclick = e => { e.preventDefault(); askAboutText(); };
  form.onsubmit = async e => {
    e.preventDefault();
    if (!form.video.files[0]) { toast("Choose the reel you posted first", true); return; }
    if (form.has_text.checked && !form.clean.files[0] && !acknowledged) {
      const c = await askAboutText();
      if (c !== "continue" && c !== "notext") return;
    }
    if (form.clean.files[0] && !form.clean_start.value && !form.clean_end.value) {
      const [a, b] = await Promise.all([videoLength(form.video.files[0]), videoLength(form.clean.files[0])]);
      if (a && b && Math.abs(a - b) > 2) {
        const c = await modal(`<h3>The clean copy is a different length</h3>
          <p>Your posted reel is <b>${fmtLen(a)}</b> but the clean copy is <b>${fmtLen(b)}</b>.</p>
          <p>If the clean copy is the raw recording, enter where the part you used <b>starts</b> and <b>ends</b>
          (for example 1:05 and 1:50), so the mirrored version and reposts match the reel.</p>`,
          [{label: "Enter start and end", value: "trim", kind: "approve"}, {label: "Use the whole clean copy", value: "whole"}]);
        if (c !== "whole") { form.clean_start.focus(); return; }
      }
    }
    const fd = new FormData();
    fd.append("video", form.video.files[0]);
    if (form.clean.files[0]) fd.append("clean", form.clean.files[0]);
    fd.append("posted_at", new Date(form.posted_at.value).toISOString());   // exact moment, with time zone
    fd.append("title", form.title.value); fd.append("caption", form.caption.value);
    fd.append("platforms", [...form.querySelectorAll("[name=plat]:checked")].map(x => x.value).join(","));
    fd.append("done", [...form.querySelectorAll("[name=done]:checked")].map(x => x.value).join(","));
    fd.append("has_text", form.has_text.checked); fd.append("auto_repost", form.auto_repost.checked);
    fd.append("missed", form.querySelector("[name=missed]:checked").value);
    fd.append("clean_start", form.clean_start.value); fd.append("clean_end", form.clean_end.value);
    const btn = form.querySelector("button"); btn.disabled = true; btn.textContent = "Uploading and importing...";
    const out = $("#impresult", v);
    try {
      let r, j;
      try {
        r = await fetch("/api/import", {method: "POST", body: fd});
        j = await r.json().catch(() => ({detail: `The app returned an error (${r.status}). Check the log for details.`}));
      } catch (err) { j = {detail: "Couldn't reach the app. Is it still running?"}; r = {ok: false}; }
      if (!r.ok) { out.innerHTML = `<p class="s-lo">${esc(j.detail)}</p>`; toast(j.detail, true); return; }
      toast("Imported and scheduled");
      out.innerHTML = `${(j.warnings||[]).map(w => `<p class="s-mid">${esc(w)}</p>`).join("")}<b>Imported as clip ${j.clip_id}.</b> Here's its schedule:<table>${j.steps.map(st =>
        `<tr><td>${esc(st.label)}</td><td>${esc(st.action)}</td><td>${st.at ? when(st.at) : ""}</td></tr>`).join("")}</table>
        <p class="muted">You'll find it with countdowns in the Posted tab. Import another below.</p>`;
      form.reset(); form.posted_at.value = localNow(); updateDue(); acknowledged = false;
    } finally { btn.disabled = false; btn.textContent = "Import and schedule"; }
  };
}
window.addEventListener("hashchange", () => { current = location.hash.slice(1) || "review"; load(); });
load();
</script>
</body>
</html>
