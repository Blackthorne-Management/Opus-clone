[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kir-clipper"
version = "0.1.0"
description = "Automated stream-to-shorts pipeline for Keepingit_Rael"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "watchdog>=4.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "pillow>=10.0",  # thumbnails + Gemini image handling
  "tzdata>=2024.1",  # time zones on Windows
]

[project.optional-dependencies]
# Local GPU/CPU transcription (recommended).
whisper = ["faster-whisper>=1.0"]
# Speaker-aware reframing (face tracking). Without it, clips use center crop.
faces = ["opencv-python-headless>=4.9"]
# OpenAI Whisper API instead of local faster-whisper.
openai = ["openai>=1.30"]
# Auto cut-out of your photo for thumbnails (only needed if your photos lack a transparent background).
thumbs = ["rembg>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
kir = "kir_clipper.cli:main"

[tool.setuptools.packages.find]
include = ["kir_clipper*"]

[tool.setuptools.package-data]
kir_clipper = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
